<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profiles - JSON Lab</title>
    <style>
        .user-card { border:1px solid #999; padding:14px; margin:10px 0; border-radius:8px; }
    </style>
</head>
<body>
    <h1>User Profiles from JSON</h1>
    <div id="userContainer"></div>

    <script>
        const container = document.getElementById("userContainer");

        fetch("userProfiles.json")
            .then(response => {
                if (!response.ok) throw new Error('Fetch error: ' + response.status);
                return response.json();
            })
            .then(json => {
                json.forEach(user => {
                    const card = document.createElement("div");
                    card.className = "user-card";
                    card.innerHTML = `
                        <p><strong>Name:</strong> ${user.firstName} ${user.lastName}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>Date of Birth:</strong> ${user.dateOfBirth}</p>
                        <p><strong>Address:</strong> ${user.address.street}, ${user.address.city}, ${user.address.state} ${user.address.zipCode}</p>
                        <p><strong>Theme:</strong> ${user.preferences.theme}</p>
                        <p><strong>Language:</strong> ${user.preferences.language}</p>
                        <p><strong>Notifications:</strong> ${user.preferences.notifications}</p>
                        <p><strong>Newsletter Subscription:</strong> ${user.preferences.subscription}</p>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                container.innerText = "Failed to load JSON: " + err.message;
                console.error('Fetch error: ' + err.message);
            });
    </script>
</body>
</html>
